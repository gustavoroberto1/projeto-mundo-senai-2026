services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senai}
      POSTGRES_DB: ${POSTGRES_DB:-senai_arcade}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - senai_arcade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-senai}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  senai_arcade_pgdata:
