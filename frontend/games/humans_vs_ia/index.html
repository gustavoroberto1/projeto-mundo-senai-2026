<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humans vs IA</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../css/game-shell.css">
</head>
<body>
<div id="jogo">
  <img id="fundo" src="img/cenario.png" alt="">
  <div id="campo"></div>
  <div id="topo">
    <div id="sol"><span class="sol-icone"></span><b id="solTexto">100</b></div>
    <div id="pontos"><small>PONTOS</small><b id="pontosTexto">0</b><small id="recorde">Recorde: 0</small></div>
    <div id="onda"><small>ONDA</small><b id="ondaTexto">1</b></div>
    <div id="cards"></div>
    <div id="info">Robôs abatidos: <b id="abates">0</b></div>
    <button id="btnVel">2X</button>
    <button id="btnPausa">Pausar</button>
  </div>
  <div id="bannerOnda"></div>
  <div id="aviso"></div>
</div>
<script src="../../js/config.js"></script>
<script src="../../js/arcade-sdk.js"></script>
<script src="../../js/game-shell.js"></script>
<script>window.SENAI_ARCADE_GAME_ID = "HUMANS_VS_IA";</script>
<script src="script.js"></script>
<script>
  ArcadeShell.init({
    gameId: "HUMANS_VS_IA",
    gameName: "Humans vs IA",
    description: "Defenda sua base contra a invasão dos robôs.",
    accentColor: "#29f4e1",
    onPlay: function () { pausado = false; },
    getScore: function () { return pontos; },
  });
</script>
</body>
</html>
